<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LipoControl - Recuperar contraseña</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="container">
    <h1>LipoControl</h1>
    <p class="subtitulo">Te enviaremos un enlace para crear una nueva contraseña.</p>

    <form onsubmit="pedirEnlace(event)">
    <label for="correo">Correo Electrónico</label>
    <input
        type="email"
        id="correo"
        placeholder="Ingrese su correo electrónico"
        autocomplete="email"
        required
    >

    <p id="mensaje" role="alert"></p>

    <button type="submit" id="boton">Enviar enlace</button>
    </form>

    <p><a href="index.html">Volver al inicio de sesión</a></p>
</div>

<script>
    const API_URL = "http://localhost:3001";

    async function pedirEnlace(event) {
    event.preventDefault();

    const mensaje = document.getElementById("mensaje");
    const boton = document.getElementById("boton");
    const correo = document.getElementById("correo").value;

    boton.disabled = true;
    mensaje.textContent = "Enviando...";

    try {
        const respuesta = await fetch(`${API_URL}/olvide-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ correo })
        });

        const datos = await respuesta.json();
        mensaje.textContent = datos.mensaje;
    } catch (error) {
        mensaje.textContent = "No se pudo conectar con el servidor.";
    }

    boton.disabled = false;
    }
</script>

</body>
</html>
