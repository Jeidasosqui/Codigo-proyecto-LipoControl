<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LipoControl - Nueva contraseña</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="container">
    <h1>LipoControl</h1>
    <p class="subtitulo">Crea tu nueva contraseña</p>

<form onsubmit="restablecer(event)">
    <label for="password">Nueva contraseña</label>
    <input
        type="password"
        id="password"
        placeholder="Ingrese su nueva contraseña"
        autocomplete="new-password"
        required
    >

    <label for="confirmar">Confirmar contraseña</label>
    <input
        type="password"
        id="confirmar"
        placeholder="Repita su nueva contraseña"
        autocomplete="new-password"
        required
    >

    <p id="mensaje" role="alert"></p>

    <button type="submit">Guardar contraseña</button> </form>

<p><a href="index.html">Volver al inicio de sesión</a></p>
</div>

<script>
const API_URL = "http://localhost:3001";

  // La llave viaja en la dirección: ...reset-password.html?token=LLAVE
const token = new URLSearchParams(window.location.search).get("token");

async function restablecer(event) {
    event.preventDefault();

    const mensaje = document.getElementById("mensaje");
    const password = document.getElementById("password").value;
    const confirmar = document.getElementById("confirmar").value;

    if (!token) {
        mensaje.textContent = "El enlace no es válido. Solicita uno nuevo.";
        return;
    }

    if (password !== confirmar) {
        mensaje.textContent = "Las contraseñas no coinciden.";
        return;
    }

    try {
        const respuesta = await fetch(`${API_URL}/restablecer-password`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token, password })
    });

        const datos = await respuesta.json();
        mensaje.textContent = datos.mensaje;

    if (datos.ok) {
        setTimeout(() => { window.location.href = "index.html"; }, 2000);
    }
    } catch (error) {
        mensaje.textContent = "No se pudo conectar con el servidor.";
    }
}
</script>

</body>
</html>
