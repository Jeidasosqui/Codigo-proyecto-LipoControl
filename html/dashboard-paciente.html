<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Paciente</title>
  <link rel="stylesheet" href="../css/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h3 id="bienvenida" class="bienvenida"></h3>
  
<div class="dashboard">

  <h2>Panel del Paciente</h2>

  <!-- FORMULARIO -->
  <div class="card">

    <h3>Registrar Datos</h3>

    <div class="fila-flex">
          <input type="number" id="colesterolhdl" placeholder="Colesterol hdl" oninput="calcularcolesteroltotal()">
          <input type="number" id="colesterolldl" placeholder="Colesterol ldl" oninput="calcularcolesteroltotal()">
    </div>

    <div class="fila-flex">
          <input type="number" id="colesterolvldl" placeholder="Colesterol vldl" oninput="calcularcolesteroltotal()">
          <input type="number" id="trigliceridos" placeholder="Triglicéridos">
    </div>

    <div class= "resultadoColesterol">
          <span> Colesterol Total </span>
          <strong id="colesteroltotal">0</strong>
          <small>mg/dl</small>
    </div>

    <select id="tipomedicion" class="select-medicion">
          <option value="ayunas">En ayunas</option>
          <option value="no_ayunas">Sin ayunas</option>
    </select>

    <button onclick="guardarDatos()">Guardar</button>
  </div>

  <!-- HISTORIAL -->
  <div class="card">
    <h3>Historial</h3>
    <ul id="historial" </ul>
  </div>
  <div class="card">
    <h3>Gráfica de evolución</h3>
    <canvas id="miGrafica"></canvas>
  </div>

  <button class="btn-cerrar" onclick="cerrarSesion()">Cerrar sesión</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/script.js"></script>

</body>
</html>
